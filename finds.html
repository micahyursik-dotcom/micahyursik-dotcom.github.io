<style>

  :root {
    --cream: #FBF4F2;
    --blush: #F5DEE0;
    --blush-deep: #EFC9CF;
    --card: #FFFDFC;
    --card-edge: #EBD6D6;
    --ink: #4A3A36;
    --ink-soft: #7C6862;
    --ink-faint: #A99590;
    --rose: #C4667C;
    --rose-deep: #A94F66;
    --rose-soft: #F7E3E7;
    --bronze-hi: #B98A5B;
    --bronze-lo: #7A4A2E;
    --sage: #8A9C86;
    --shadow: 0 22px 44px -24px rgba(150, 70, 90, .35);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: "Lora", Georgia, serif;
    font-size: 17px;
    line-height: 1.55;
    padding-inline: 20px;
    padding-block: 44px 56px;
    position: relative;
    overflow-x: hidden;
    background:
      radial-gradient(60% 40% at 8% 12%, var(--blush) 0%, transparent 70%),
      radial-gradient(55% 45% at 95% 30%, var(--blush-deep) 0%, transparent 70%),
      radial-gradient(50% 40% at 15% 85%, var(--blush) 0%, transparent 70%),
      radial-gradient(45% 35% at 85% 95%, #F3E6DC 0%, transparent 70%),
      var(--cream);
  }
  .floral {
    position: absolute;
    width: min(62vw, 420px);
    pointer-events: none;
    user-select: none;
    z-index: 0;
    opacity: .95;
  }
  .floral.tr { top: -28px; right: -48px; }
  .floral.bl { bottom: -28px; left: -48px; transform: scale(-1); opacity: .8; }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 520px;
    margin-inline: auto;
    display: grid;
    gap: 34px;
  }

  /* ---- type helpers ---- */
  .script { font-family: "Dancing Script", "Brush Script MT", cursive; color: var(--rose); }
  .bronze {
    background: linear-gradient(180deg, var(--bronze-hi) 0%, var(--bronze-lo) 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .caps {
    font-family: "Playfair Display", Georgia, serif;
    text-transform: uppercase;
    letter-spacing: .18em;
    font-size: 12px;
    font-weight: 600;
  }
  .hearts {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    color: var(--rose);
    font-size: 15px;
  }
  .hearts::before, .hearts::after { content: ""; height: 1px; width: 34px; background: var(--rose); opacity: .6; }

  /* ---- header ---- */
  .who {
    display: grid;
    justify-items: center;
    text-align: center;
    gap: 8px;
    padding-top: 14px;
  }
  .who .pic { position: relative; width: 140px; height: 140px; }
  .who .pic::before {          /* soft rose watercolor halo behind the photo */
    content: "";
    position: absolute; inset: -14px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(196,102,124,.35) 0%, rgba(196,102,124,.12) 55%, transparent 72%);
    filter: blur(2px);
  }
  .who img {
    position: relative;
    width: 140px; height: 140px;
    border-radius: 50%;
    object-fit: cover;
    max-width: 100%;
    box-shadow: 0 0 0 4px var(--card), 0 10px 24px -10px rgba(120,50,70,.4);
  }
  .who h1 {
    margin: 12px 0 0;
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 700;
    font-size: 36px;
    line-height: 1.05;
    letter-spacing: -.01em;
  }
  .who .role { color: var(--rose-deep); margin-top: 4px; font-size: 13px; }
  .who .role span { margin: 0 6px; color: var(--rose); }
  .who .tag {
    margin: 8px 0 0;
    max-width: 30ch;
    font-family: "Playfair Display", Georgia, serif;
    font-style: italic;
    font-size: 21px;
    line-height: 1.3;
    color: var(--ink);
    text-wrap: balance;
  }
  .who .tag .ref {
    display: block;
    margin-top: 6px;
    font-style: normal;
    font-size: 11px;
    color: var(--ink-faint);
  }

  /* ---- THE signup ---- */
  .signup { display: grid; gap: 12px; }
  .cta {
    position: relative;
    display: block;
    width: 100%;
    border: 0;
    background: transparent;
    padding: 0;
    cursor: pointer;
    text-align: center;
    -webkit-tap-highlight-color: transparent;
  }
  .cta .band {
    position: absolute; inset: 0;
    background: var(--rose);
    border-radius: 8px;
    filter: url(#brush);
    box-shadow: 0 16px 30px -14px rgba(169,79,102,.65);
    transition: transform .12s ease, background .12s ease;
  }
  .cta:hover .band, .cta:focus-visible .band { background: var(--rose-deep); }
  .cta:active .band { transform: scale(.985); }
  .cta .label {
    position: relative;
    display: grid;
    gap: 6px;
    padding: 22px 22px 20px;
    color: #fff;
  }
  .cta .label .small {
    font-family: "Playfair Display", Georgia, serif;
    text-transform: uppercase;
    letter-spacing: .18em;
    font-size: 12px;
    font-weight: 600;
    opacity: .9;
  }
  .cta .label .big {
    font-family: "Playfair Display", Georgia, serif;
    font-size: 27px;
    line-height: 1.1;
    font-weight: 700;
    text-wrap: balance;
  }
  .cta .label .tap {
    display: inline-flex; justify-content: center; align-items: center; gap: 8px;
    margin: 6px auto 0;
    padding: 9px 18px;
    border-radius: 999px;
    background: #fff;
    color: var(--rose-deep);
    font-family: "Lora", Georgia, serif;
    font-weight: 600;
    font-size: 15px;
  }
  .cta:focus-visible { outline: 3px solid rgba(196,102,124,.5); outline-offset: 4px; border-radius: 8px; }
  .signup .fine {
    margin: 0;
    text-align: center;
    font-size: 13.5px;
    color: var(--ink-soft);
  }
  .signup .fine b { color: var(--rose); font-weight: 600; }

  .formwrap {
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 16px;
    padding: 18px 18px 16px;
    box-shadow: var(--shadow);
  }
  form { display: grid; gap: 10px; }
  .field { display: grid; gap: 5px; }
  .field label { color: var(--ink-faint); }
  input[type="email"], input[type="text"] {
    width: 100%;
    font: inherit;
    font-size: 17px;
    padding: 14px 15px;
    border-radius: 12px;
    border: 1.5px solid var(--card-edge);
    background: #fff;
    color: var(--ink);
  }
  input:focus-visible, button:focus-visible, a:focus-visible {
    outline: 3px solid rgba(196,102,124,.45);
    outline-offset: 2px;
  }
  .btn {
    display: inline-flex; justify-content: center; align-items: center; gap: 8px;
    width: 100%;
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: .1em;
    text-transform: uppercase;
    padding: 17px 18px;
    border-radius: 12px;
    border: 0;
    cursor: pointer;
    text-decoration: none;
    transition: transform .12s ease, filter .12s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn-rose { background: var(--rose); color: #fff; }
  .btn-rose:hover { background: var(--rose-deep); }
  .btn-sage { background: var(--sage); color: #fff; }
  .btn-quiet { background: var(--card); color: var(--ink); border: 1.5px solid var(--card-edge); }
  .btn-link { background: transparent; color: var(--rose); border: 1.5px solid var(--rose); }
  .thanks {
    background: var(--rose-soft);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .thanks p { margin: 0; }
  .thanks p:first-child { font-family: "Playfair Display", Georgia, serif; font-weight: 600; font-size: 19px; }
  .thanks p + p { margin-top: 6px; color: var(--ink-soft); font-size: 15px; }
  .thanks a { color: var(--rose); }

  /* ---- what's in it ---- */
  .note {
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 18px;
    padding: 28px 24px 24px;
    box-shadow: var(--shadow);
    display: grid;
    gap: 14px;
    text-align: center;
  }
  .note h2 {
    margin: 0;
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 700;
    font-size: 30px;
    line-height: 1.1;
    text-wrap: balance;
  }
  .note h2 .script { font-size: 1.25em; font-weight: 600; }
  .note > p { margin: 0; color: var(--ink-soft); font-size: 16.5px; }
  .whatsin {
    list-style: none; margin: 4px 0 0; padding: 0;
    display: grid; gap: 10px;
    text-align: left;
  }
  .whatsin li { display: grid; grid-template-columns: 24px 1fr; gap: 8px; align-items: start; }
  .whatsin li::before { content: "♥"; color: var(--rose); font-size: 15px; line-height: 1.6; }
  .whatsin strong { font-family: "Playfair Display", Georgia, serif; font-weight: 600; }
  .whatsin small { display: block; color: var(--ink-soft); font-size: 14.5px; }

  /* ---- freebies ---- */
  .freebies { display: grid; gap: 16px; }
  .freebies > h2 {
    margin: 0; text-align: center;
    font-family: "Playfair Display", Georgia, serif; font-weight: 700; font-size: 30px; line-height: 1.1;
  }
  .freebies > p.sub { margin: -6px 0 0; text-align: center; font-size: 22px; }
  .gate {
    background: var(--card); border: 1px solid var(--card-edge); border-radius: 18px;
    padding: 20px; box-shadow: var(--shadow); display: grid; gap: 12px;
    scroll-margin-top: 20px;
  }
  .gate .top { display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: center; }
  .gate .top img { width: 96px; max-width: 100%; border-radius: 8px; box-shadow: 0 8px 18px -10px rgba(120,50,70,.45); border: 1px solid var(--card-edge); }
  .gate h3 { margin: 0 0 4px; font-family: "Playfair Display", Georgia, serif; font-weight: 700; font-size: 20px; line-height: 1.15; }
  .gate .top p { margin: 0; color: var(--ink-soft); font-size: 15px; }
  .gate form { gap: 8px; }
  .gate .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .gate .row input { min-width: 0; }
  .gate .row .btn { width: auto; padding-inline: 16px; white-space: nowrap; }
  .gate .disclose { text-align: left; }
  .gate .thanks .dl { display: inline-flex; margin-top: 10px; width: 100%; }
  @media (max-width: 420px) {
    .gate .row { grid-template-columns: 1fr; }
    .gate .row .btn { width: 100%; }
  }

  /* ---- things I actually use ---- */
  .picks { display: grid; gap: 12px; scroll-margin-top: 24px; }
  .picks h2 {
    margin: 0;
    text-align: center;
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 700;
    font-size: 30px;
    line-height: 1.1;
  }
  .group { display: grid; gap: 8px; }
  .group h3 { margin: 8px 0 0; color: var(--rose); }
  .pick {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 14px;
    color: inherit; text-decoration: none;
  }
  .pick:hover { border-color: var(--rose); }
  .pick .name { font-family: "Playfair Display", Georgia, serif; font-weight: 600; }
  .pick .why { font-size: 14px; color: var(--ink-soft); margin-top: 2px; }
  .pick .go { color: var(--rose); white-space: nowrap; }
  .soon {
    background: var(--rose-soft);
    border-radius: 14px;
    padding: 14px 18px;
    color: var(--ink-soft);
    font-size: 15px;
    text-align: center;
  }
  .soon p { margin: 0; }
  .disclose { font-size: 12px; color: var(--ink-faint); margin: 0; text-align: center; }

  /* ---- footer ---- */
  .follow { display: grid; gap: 10px; }
  .verse {
    text-align: center;
    color: var(--ink-soft);
    font-style: italic;
    font-size: 17px;
    margin: 0;
    text-wrap: balance;
  }
  .verse .caps { display: block; margin-top: 10px; font-style: normal; color: var(--ink-faint); font-size: 11px; }
  [hidden] { display: none !important; }

  @media (max-width: 420px) {
    body { font-size: 16px; padding-block: 36px 48px; }
    .who h1 { font-size: 32px; }
    .who .tag { font-size: 19px; }
    .cta .label .big { font-size: 24px; }
    .note, .formwrap { padding-inline: 18px; }
    .note h2, .picks h2 { font-size: 27px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn, .cta .band { transition: none; }
  }

  /* finds page */
  .finds-head { text-align: center; display: grid; gap: 6px; justify-items: center; }
  .finds-head img { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 4px var(--card), 0 10px 24px -10px rgba(120,50,70,.4); }
  .finds-head h1 { margin: 8px 0 0; font-family: "Playfair Display", Georgia, serif; font-weight: 700; font-size: 32px; line-height: 1.05; }
  .finds-head p { margin: 0; font-size: 22px; }
  .cat { display: grid; gap: 10px; }
  .cat h2 { margin: 0; font-family: "Playfair Display", Georgia, serif; font-weight: 700; font-size: 20px; color: var(--rose-deep); display: flex; align-items: center; gap: 10px; }
  .cat h2::after { content: ""; flex: 1; height: 1px; background: var(--card-edge); }
  .tile {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px;
    padding: 14px 16px; background: var(--card); border: 1px solid var(--card-edge); border-radius: 14px;
    color: inherit; text-decoration: none; box-shadow: 0 12px 26px -20px rgba(150,70,90,.35);
  }
  .tile:hover { border-color: var(--rose); }
  .tile .name { font-family: "Playfair Display", Georgia, serif; font-weight: 600; font-size: 16px; line-height: 1.25; }
  .tile .why { font-size: 14px; color: var(--ink-soft); margin-top: 3px; }
  .tile .go { background: var(--rose); color: #fff; font-family: "Playfair Display", Georgia, serif; font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; padding: 10px 14px; border-radius: 10px; white-space: nowrap; }
  .back { text-align: center; }
  .back a { color: var(--rose-deep); font-family: "Playfair Display", Georgia, serif; font-weight: 600; text-decoration: none; }
</style>

<img class="floral tr" src="floral.webp" alt="" aria-hidden="true">

<main class="wrap">

  <a class="btn btn-sage" id="storefront" href="#" hidden>See my full Amazon storefront</a>

  <div id="cats" style="display:grid;gap:26px"></div>

  <p class="disclose">As an Amazon Associate I earn from qualifying purchases &mdash; at no extra cost to you. Thank you for supporting this little corner of the internet. &hearts;</p>

  <div class="hearts" aria-hidden="true">&hearts;</div>

    <a class="btn btn-quiet" href="https://www.tiktok.com/@micahyursik">Follow on TikTok</a>
  </section>
</main>
<script>
  // Amazon storefront URL (from the Influencer Program). Empty hides the button.
  const STOREFRONT_URL = "";

  const PICKS = [
    { group: "At-home microneedling", items: [
      { name: "Microneedle derma roller (0.25mm)", why: "the one I actually use", url: "https://amzn.to/4xUV82P" },
      { name: "Lidocaine numbing cream (5%)", why: "makes it painless", url: "https://amzn.to/472BqX2" },
      { name: "The Ordinary hyaluronic acid serum", why: "after-roll hydration", url: "https://amzn.to/4r9FIW9" },
      { name: "Spa headbands + scrunchies", why: "hair out of the way", url: "https://amzn.to/4rlMs39" },
    ]},
    { group: "Disney trip", items: [
      { name: "Toddler harness leash (3-in-1)", why: "crowds + a runner = this", url: "https://amzn.to/4iprJsT" },
      { name: "Minnie stroller organizer", why: "snacks, wipes, phone", url: "https://amzn.to/4rhZgaY" },
      { name: "Pink polka-dot fanny pack for kids", why: "she carries her own stuff", url: "https://amzn.to/4h8pQyA" },
    ]},
    { group: "Bath & teeth", items: [
      { name: "Bath toy organizer + foam ABC letters", why: "", url: "https://amzn.to/46omrXm" },
      { name: "Boka toothpaste (fluoride-free, nano-hydroxyapatite)", why: "mine", url: "https://amzn.to/4yGffly" },
      { name: "LOL! Kids strawberry toothpaste", why: "the kids' version", url: "https://amzn.to/4hvbzw7" },
      { name: "Kids electric U-shaped toothbrush (axolotl)", why: "brushes every tooth in 30 seconds, no fight", url: "https://amzn.to/4cOj3Zw" },
      { name: "U-shaped toddler toothbrush (2-pack)", why: "the simple no-battery version", url: "https://amzn.to/4AffXHZ" },
      { name: "Kids folding step stool", why: "sink + potty independence", url: "https://amzn.to/4xRjlak" },
      { name: "Toilet stool (adult)", why: "yes, really", url: "https://amzn.to/4hs7UQG" },
    ]},
    { group: "Vitamins & supplements", items: [
      { name: "Organic Lion's Mane capsules", why: "memory + focus for mom brain", url: "https://amzn.to/4h1Usl3" },
      { name: "Kids multivitamin gummies with iron", why: "sugar-free, methylated", url: "https://amzn.to/46q9yfm" },
      { name: "Kids super greens gummies", why: "for the veggie refusers", url: "https://amzn.to/46pPJVv" },
      { name: "Kids calm gummies (magnesium + omega-3)", why: "bedtime helper", url: "https://amzn.to/4AeDett" },
      { name: "Organic super greens powder", why: "my morning greens, 0 sugar", url: "https://amzn.to/46Wd9C3" },
    ]},
    { group: "My low-tox makeup", items: [
      { name: "IT Cosmetics CC+ Cream SPF 50", why: "my everyday foundation", url: "https://amzn.to/3T4lxw8" },
    ]},
    { group: "Crafts & learning", items: [
      { name: "Crayola Twistables crayons (24)", why: "no peeling, no breaking", url: "https://amzn.to/3UVA2mr" },
      { name: "Toddler crayons (ages 1–3)", why: "unbreakable, non-toxic", url: "https://amzn.to/4h1V3TP" },
      { name: "Disappearing magic ink pens", why: "church + restaurant lifesaver", url: "https://amzn.to/4yDPkLe" },
      { name: "Grooved handwriting practice books", why: "ages 3–8", url: "https://amzn.to/3Vw9iZV" },
      { name: "Mini squishies (30-pack)", why: "treasure box + party favors", url: "https://amzn.to/4iuSsV4" },
      { name: "Composition notebooks (3-pack)", why: "classic, cheap, kid-proof", url: "https://amzn.to/4h27zmh" },
    ]},
    { group: "Clothes", items: [
      { name: "Pink tennis outfit (mine)", why: "", url: "https://amzn.to/3US13Y2" },
      { name: "Girls' quick-dry skorts", why: "The Children's Place", url: "https://amzn.to/4h5BcmW" },
      { name: "Scrunch booty-lifting leggings", why: "seamless, high-waisted, mom-approved", url: "https://amzn.to/4yyRoE7" },
    ]},
    { group: "Clean water", items: [
      { name: "Gravity countertop water filter (Berkey dupe)", why: "stainless, 2.25 gal, half the price", url: "https://amzn.to/3UWH3U2" },
      { name: "Replacement fluoride filters (fits Berkey)", why: "for the countertop system", url: "https://amzn.to/4r9BQnU" },
      { name: "Under-sink water filter (Waterdrop)", why: "set it and forget it for a year", url: "https://amzn.to/4xuUqsj" },
    ]},
    { group: "Home & cleaning", items: [
      { name: "Shark StainStriker spot cleaner", why: "spills, potty accidents, car seats", url: "https://amzn.to/3Txr5PR" },
      { name: "Levoit cordless vacuum", why: "light enough for one-handed crumbs", url: "https://amzn.to/4y2o8pI" },
      { name: "Waterproof mattress protector (queen)", why: "noiseless — you won't hear it", url: "https://amzn.to/4yDkdzd" },
      { name: "Washed-cotton duvet cover (almond)", why: "the linen look without the price", url: "https://amzn.to/4cJo31x" },
      { name: "Kids spill-proof stainless cups (5-pack)", why: "lids + straws, no more plastic", url: "https://amzn.to/3Twn1iQ" },
    ]},
  ];

  const store = document.getElementById('storefront');
  if (STOREFRONT_URL) { store.href = STOREFRONT_URL; store.hidden = false; store.target = '_blank'; store.rel = 'noopener sponsored'; }
  store.addEventListener('click', () => { window.goatcounter && goatcounter.count({ path: 'finds/storefront', title: 'Amazon storefront', event: true }); });
  const cats = document.getElementById('cats');
  for (const g of PICKS) {
    if (!g.items.length) continue;
    const sec = document.createElement('section'); sec.className = 'cat';
    const h = document.createElement('h2'); h.textContent = g.group; sec.appendChild(h);
    for (const p of g.items) {
      const a = document.createElement('a'); a.className = 'tile'; a.href = p.url; a.target = '_blank'; a.rel = 'noopener sponsored';
      const left = document.createElement('div');
      const n = document.createElement('div'); n.className = 'name'; n.textContent = p.name; left.appendChild(n);
      if (p.why) { const w = document.createElement('div'); w.className = 'why'; w.textContent = p.why; left.appendChild(w); }
      const go = document.createElement('span'); go.className = 'go'; go.textContent = 'Shop';
      a.addEventListener('click', () => { window.goatcounter && goatcounter.count({ path: 'finds/' + p.name, title: p.name, event: true }); });
      a.append(left, go); sec.appendChild(a);
    }
    cats.appendChild(sec);
  }
</script>
</body>
</html>
